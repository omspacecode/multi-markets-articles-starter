<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; padding: 12px; display: flex; gap: 16px; align-items: flex-start; background: #ddd; font: 12px sans-serif; }
      figure { margin: 0; }
      iframe { border: 1px solid #999; background: #fff; display: block; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const path = params.get("path") || "/dk";
      const extra = params.get("extra") || "";
      for (const [label, w] of [["phone 390", 390], ["tablet 768", 768]]) {
        const fig = document.createElement("figure");
        fig.innerHTML = `<figcaption>${label}</figcaption>`;
        const frame = document.createElement("iframe");
        frame.width = w;
        frame.height = 1000;
        frame.src = `${path}?__proxy=1${extra}`;
        fig.appendChild(frame);
        document.body.appendChild(fig);
      }
    </script>
  </body>
</html>
